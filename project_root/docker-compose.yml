services:
  auth_service:
    build: ./services/auth_service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/auth_service:/app
    ports:
      - "8001:8000"
    depends_on:
      - auth_db
    env_file:
      - .env

  auth_db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}